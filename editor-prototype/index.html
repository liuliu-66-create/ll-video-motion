<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="视频动效素材库第20号模板可编辑原型" />
  <title>上下拆解式 · 可编辑原型</title>
  <style>
    :root {
      --ink: #171512;
      --paper: #eee7db;
      --paper-deep: #d8cdbd;
      --line: rgba(62, 52, 42, .18);
      --muted: #6c655d;
      --brick: #9a382d;
      --brick-soft: rgba(154, 56, 45, .1);
      --shadow: 0 22px 56px rgba(72, 55, 38, .14);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      color: var(--ink);
      background: #e8e3da url('/assets/newspaper-neutral-v1.png') center / cover fixed;
      font-family: "Segoe UI Variable", "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
    }
    button, input, select { font: inherit; }
    .shell {
      min-height: 100dvh;
      display: grid;
      grid-template-columns: minmax(300px, 380px) minmax(0, 1fr);
    }
    .panel {
      min-height: 100dvh;
      padding: 28px 24px 36px;
      border-right: 1px solid var(--line);
      background: rgba(244, 240, 232, .94);
      backdrop-filter: blur(18px);
    }
    .eyebrow { margin: 0 0 8px; color: var(--brick); font-size: 12px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 0; font-size: 30px; line-height: 1.08; letter-spacing: -.04em; }
    .intro { margin: 12px 0 24px; color: var(--muted); font-size: 13px; line-height: 1.7; }
    .fields { display: grid; gap: 14px; }
    label { display: grid; gap: 7px; color: var(--muted); font-size: 12px; font-weight: 700; }
    input, select {
      width: 100%;
      height: 42px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      outline: none;
      color: var(--ink);
      background: rgba(255, 255, 255, .58);
      transition: border-color 180ms ease, background 180ms ease;
    }
    input:focus, select:focus { border-color: var(--brick); background: rgba(255, 255, 255, .86); }
    .triple { display: grid; grid-template-columns: .8fr 1fr .7fr; gap: 8px; }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-top: 22px; }
    button {
      min-height: 42px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--ink);
      background: rgba(255, 255, 255, .58);
      cursor: pointer;
      transition: transform 160ms ease, background 160ms ease, border-color 160ms ease;
    }
    button:hover { background: #fffaf2; border-color: rgba(154, 56, 45, .34); }
    button:active { transform: translateY(1px) scale(.99); }
    button:focus-visible { outline: 2px solid var(--brick); outline-offset: 2px; }
    .primary { grid-column: 1 / -1; color: #fff9ef; border-color: var(--brick); background: var(--brick); font-weight: 800; }
    .primary:hover { color: #fff; background: #842f27; }
    button:disabled { cursor: wait; opacity: .55; }
    .status { min-height: 22px; margin: 14px 0 0; color: var(--muted); font-size: 12px; line-height: 1.6; }
    .status.error { color: var(--brick); }
    .workbench { min-width: 0; padding: 34px clamp(22px, 4vw, 66px) 44px; }
    .work-head { display: flex; justify-content: space-between; gap: 16px; align-items: end; margin-bottom: 18px; }
    .work-head p { margin: 0 0 6px; color: var(--brick); font-size: 12px; font-weight: 800; letter-spacing: .1em; }
    .work-head h2 { margin: 0; font-size: clamp(30px, 4vw, 52px); letter-spacing: -.05em; }
    .safe-note { max-width: 260px; margin: 0; color: var(--muted); font-size: 12px; line-height: 1.6; text-align: right; }
    .preview {
      position: relative;
      width: min(100%, 1180px);
      aspect-ratio: 16 / 9;
      overflow: hidden;
      border: 1px solid rgba(23, 21, 18, .25);
      border-radius: 12px;
      background: #dfdcd4 url('/assets/newspaper-neutral-v1.png') center / cover;
      box-shadow: var(--shadow);
    }
    .preview-title { position: absolute; left: 25.25%; top: 9.7%; width: 49.5%; text-align: center; }
    .preview-title strong { display: block; font: 1000 clamp(38px, 7.3vw, 112px) / .95 "Arial Black", Impact, sans-serif; letter-spacing: -.06em; }
    .preview-title span { display: block; margin-top: 2%; font-size: clamp(13px, 2.25vw, 36px); font-weight: 900; }
    .connector { position: absolute; left: 14.3%; top: 35.3%; width: 74%; height: 13.2%; border-top: 3px solid var(--brick); border-left: 3px solid var(--brick); border-right: 3px solid var(--brick); border-radius: 18px 18px 0 0; }
    .connector::before { content: ""; position: absolute; left: 50%; top: -12%; width: 3px; height: 72%; background: var(--brick); }
    .sheet {
      position: absolute;
      left: 6%; top: 47.4%; width: 88%; height: 35.6%;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      align-items: center;
      padding: 5% 4%;
      background: #eee5d5 url('/assets/paper-fiber-texture-v1.png') center / 24% auto;
      clip-path: polygon(.5% 7%,3.1% 3%,6.8% 8%,10.5% 4%,14.8% 10%,18.2% 3%,22.9% 7%,27.4% 2%,31.6% 8%,36.5% 4%,41.1% 10%,45.8% 3%,50.3% 7%,55.8% 2%,60.7% 9%,66.1% 4%,71.8% 8%,76.4% 3%,82.5% 10%,87.2% 4%,92.5% 8%,97.4% 3%,99.5% 7%,99.8% 22%,99.1% 39%,99.7% 57%,99% 75%,99.4% 92%,97.5% 96%,93.8% 91%,89.6% 98%,84.2% 92%,79.1% 99%,74.8% 90%,69.2% 97%,64.1% 93%,59.7% 99%,54.3% 91%,49.5% 98%,44.7% 92%,39.2% 99%,34.8% 90%,29.1% 97%,24.4% 93%,19.2% 99%,14.6% 91%,9.5% 98%,5.7% 92%,1% 97%,.4% 81%,1.1% 63%,.3% 45%,1% 27%);
      filter: drop-shadow(0 16px 10px rgba(45, 30, 21, .2));
    }
    .item { min-width: 0; padding: 0 7%; text-align: center; }
    .item + .item { border-left: 1px solid rgba(23, 21, 18, .2); }
    .item b { display: block; color: var(--brick); font-size: clamp(13px, 1.8vw, 29px); }
    .item strong { display: block; margin-top: 7%; font-size: clamp(15px, 2.2vw, 35px); line-height: 1.15; white-space: nowrap; }
    .item em { color: var(--brick); font-style: normal; font-size: 1.22em; }
    .item small { display: block; margin-top: 7%; color: #5e574e; font-size: clamp(9px, 1.25vw, 20px); font-weight: 700; }
    .result { width: min(100%, 1180px); margin-top: 18px; padding: 16px; border: 1px solid var(--line); border-radius: 10px; background: rgba(244, 240, 232, .78); }
    .result[hidden] { display: none; }
    .result h3 { margin: 0 0 10px; font-size: 15px; }
    .result video { width: 100%; display: block; border-radius: 8px; background: #211f1c; }
    .download { display: inline-block; margin-top: 11px; color: var(--brick); font-size: 13px; font-weight: 800; }
    @media (max-width: 900px) {
      .shell { grid-template-columns: 1fr; }
      .panel { min-height: auto; border-right: 0; border-bottom: 1px solid var(--line); }
      .workbench { padding: 26px 16px 38px; }
      .work-head { display: block; }
      .safe-note { max-width: none; margin-top: 10px; text-align: left; }
    }
    @media (prefers-reduced-motion: reduce) { * { transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <div class="shell">
    <aside class="panel">
      <p class="eyebrow">Editable prototype</p>
      <h1>上下拆解式</h1>
      <p class="intro">先修改内容查看排版，再生成真实 MP4。这个页面与正式 Playground 完全隔离。</p>
      <form id="editor" class="fields">
        <label>核心标题<input name="coreTitle" maxlength="18" required /></label>
        <label>一句话定义<input name="definition" maxlength="30" required /></label>
        <label>左侧数据
          <span class="triple">
            <input name="leftPrefix" maxlength="8" aria-label="数据前缀" />
            <input name="leftHighlight" maxlength="8" aria-label="高亮数字" required />
            <input name="leftSuffix" maxlength="8" aria-label="数据后缀" />
          </span>
        </label>
        <label>中间重点<input name="middleText" maxlength="14" required /></label>
        <label>右侧重点<input name="rightText" maxlength="14" required /></label>
        <label>视频时长
          <select name="durationSeconds">
            <option value="4">4秒</option><option value="5">5秒</option><option value="6">6秒</option><option value="7">7秒</option><option value="8">8秒</option>
          </select>
        </label>
        <div class="actions">
          <button id="reset" type="button">恢复默认</button>
          <button id="download-config" type="button">下载配置</button>
          <button id="render" class="primary" type="submit">生成真实 MP4</button>
        </div>
      </form>
      <p id="status" class="status" aria-live="polite">修改文字即可查看右侧排版。</p>
    </aside>

    <main class="workbench">
      <header class="work-head">
        <div><p>实时排版预览</p><h2 id="heading">GitHub</h2></div>
        <p class="safe-note">这是快速排版预览；点击“生成真实 MP4”后，下面会出现 Remotion 最终视频。</p>
      </header>
      <section class="preview" aria-label="实时排版预览">
        <div class="preview-title"><strong id="p-title">GitHub</strong><span id="p-definition"></span></div>
        <div class="connector"></div>
        <div class="sheet">
          <div class="item"><b>01</b><strong><span id="p-left-prefix"></span><em id="p-left-highlight"></em><span id="p-left-suffix"></span></strong><small>找到需要的项目与工具</small></div>
          <div class="item"><b>02</b><strong id="p-middle"></strong><small>使用、修改并参与协作</small></div>
          <div class="item"><b>03</b><strong id="p-right"></strong><small>获取工具与学习资料</small></div>
        </div>
      </section>
      <section id="result" class="result" hidden>
        <h3>Remotion 最终视频</h3>
        <video id="result-video" controls loop></video>
        <a id="download-video" class="download" download>下载 MP4</a>
      </section>
    </main>
  </div>
  <script>
    const form = document.querySelector('#editor');
    const status = document.querySelector('#status');
    const renderButton = document.querySelector('#render');
    const result = document.querySelector('#result');
    const resultVideo = document.querySelector('#result-video');
    const downloadVideo = document.querySelector('#download-video');
    let defaults;

    const values = () => {
      const data = new FormData(form);
      return {
        templateId: 'concept-explainer-topdown',
        coreTitle: data.get('coreTitle'),
        definition: data.get('definition'),
        leftPrefix: data.get('leftPrefix'),
        leftHighlight: data.get('leftHighlight'),
        leftSuffix: data.get('leftSuffix'),
        middleText: data.get('middleText'),
        rightText: data.get('rightText'),
        durationSeconds: Number(data.get('durationSeconds')),
      };
    };

    const updatePreview = () => {
      const data = values();
      document.querySelector('#heading').textContent = data.coreTitle;
      document.querySelector('#p-title').textContent = data.coreTitle;
      document.querySelector('#p-definition').textContent = data.definition;
      document.querySelector('#p-left-prefix').textContent = data.leftPrefix;
      document.querySelector('#p-left-highlight').textContent = data.leftHighlight;
      document.querySelector('#p-left-suffix').textContent = data.leftSuffix;
      document.querySelector('#p-middle').textContent = data.middleText;
      document.querySelector('#p-right').textContent = data.rightText;
    };

    const applyConfig = (config) => {
      Object.entries(config).forEach(([key, value]) => {
        const field = form.elements.namedItem(key);
        if (field) field.value = String(value);
      });
      updatePreview();
    };

    const downloadJson = (data) => {
      const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
      const url = URL.createObjectURL(blob);
      const anchor = document.createElement('a');
      anchor.href = url;
      anchor.download = 'concept-explainer-topdown-config.json';
      anchor.click();
      URL.revokeObjectURL(url);
    };

    form.addEventListener('input', updatePreview);
    document.querySelector('#reset').addEventListener('click', () => {
      applyConfig(defaults);
      result.hidden = true;
      status.className = 'status';
      status.textContent = '已恢复默认内容。';
    });
    document.querySelector('#download-config').addEventListener('click', () => downloadJson(values()));
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      if (!form.reportValidity()) return;
      renderButton.disabled = true;
      result.hidden = true;
      status.className = 'status';
      status.textContent = '正在生成真实 MP4，首次运行可能需要几十秒……';
      try {
        const response = await fetch('/api/render', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify(values()),
        });
        const data = await response.json();
        if (!response.ok || !data.ok) throw new Error(data.error || '生成失败。');
        resultVideo.src = `${data.videoUrl}?t=${Date.now()}`;
        downloadVideo.href = data.videoUrl;
        downloadVideo.download = data.videoUrl.split('/').pop();
        result.hidden = false;
        status.textContent = 'MP4 已生成，可以播放或下载。';
        result.scrollIntoView({behavior: 'smooth', block: 'start'});
      } catch (error) {
        status.className = 'status error';
        status.textContent = error instanceof Error ? error.message : '生成失败。';
      } finally {
        renderButton.disabled = false;
      }
    });

    fetch('/default-config.json')
      .then((response) => response.json())
      .then((config) => { defaults = config; applyConfig(config); })
      .catch(() => { status.textContent = '默认配置读取失败。'; });
  </script>
</body>
</html>
