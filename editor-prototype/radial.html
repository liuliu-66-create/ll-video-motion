<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="第19号放射式解释动效编辑页" />
  <title>放射式解释 · 编辑动效</title>
  <style>
    :root{--ink:#171512;--paper:#eee5d5;--muted:#6c655d;--brick:#9a382d;--line:rgba(62,52,42,.18);--shadow:0 22px 56px rgba(72,55,38,.14)}
    *{box-sizing:border-box}body{margin:0;min-height:100dvh;color:var(--ink);background:#e8e3da url('/assets/newspaper-neutral-v1.png') center/cover fixed;font-family:"Segoe UI Variable","Microsoft YaHei UI","Microsoft YaHei",sans-serif}button,input,select{font:inherit}.shell{min-height:100dvh;display:grid;grid-template-columns:minmax(320px,390px) minmax(0,1fr)}
    .panel{padding:28px 24px 36px;border-right:1px solid var(--line);background:rgba(244,240,232,.95);backdrop-filter:blur(18px)}.eyebrow{margin:0 0 8px;color:var(--brick);font-size:12px;font-weight:800;letter-spacing:.14em}.panel h1{margin:0;font-size:30px;letter-spacing:-.04em}.intro{margin:12px 0 22px;color:var(--muted);font-size:13px;line-height:1.65}.fields{display:grid;gap:12px}.pair{display:grid;grid-template-columns:1fr 1.5fr;gap:8px}.triple{display:grid;grid-template-columns:.8fr 1fr .7fr;gap:6px}label{display:grid;gap:6px;color:var(--muted);font-size:12px;font-weight:700}input,select{width:100%;height:40px;padding:0 11px;border:1px solid var(--line);border-radius:8px;outline:none;background:rgba(255,255,255,.62)}input:focus,select:focus{border-color:var(--brick);background:#fff}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}button{min-height:42px;border:1px solid var(--line);border-radius:8px;background:rgba(255,255,255,.62);cursor:pointer}.primary{grid-column:1/-1;color:#fff9ef;border-color:var(--brick);background:var(--brick);font-weight:800}button:disabled{cursor:wait;opacity:.55}.status{min-height:22px;margin:13px 0 0;color:var(--muted);font-size:12px;line-height:1.5}.status.error{color:var(--brick)}
    .work{min-width:0;padding:34px clamp(22px,4vw,64px) 44px}.work-head{display:flex;justify-content:space-between;gap:16px;align-items:end;margin-bottom:18px}.work-head p{margin:0 0 6px;color:var(--brick);font-size:12px;font-weight:800;letter-spacing:.1em}.work-head h2{margin:0;font-size:clamp(30px,4vw,52px)}.note{max-width:300px;color:var(--muted)!important;line-height:1.6;text-align:right}
    .preview{position:relative;width:min(100%,1180px);aspect-ratio:16/9;overflow:hidden;border:1px solid rgba(23,21,18,.25);border-radius:12px;background:#dfdcd4;box-shadow:var(--shadow)}.stage{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;transform-origin:left top;background:#dfdcd4 url('/assets/newspaper-neutral-v1.png') center/cover;font-family:"Arial Black","Microsoft YaHei UI","Microsoft YaHei",sans-serif}.stage-lines{position:absolute;inset:0;width:1920px;height:1080px}.stage-node{position:absolute}.stage-label{color:var(--brick);font-size:34px;font-weight:900;letter-spacing:3px}.stage-main{margin-top:14px;color:var(--ink);line-height:1.12;font-weight:1000;white-space:nowrap}.stage-left{left:150px;top:135px;width:430px}.stage-right{left:1370px;top:118px;width:440px}.stage-right .stage-main{font-size:53px;line-height:1.15}.stage-right-highlight{color:var(--brick);font-size:67px}.stage-shadow{position:absolute;left:649px;top:313px;width:622px;height:348px;background:rgba(73,56,39,.13);clip-path:polygon(1% 8%,6% 3%,13% 9%,21% 2%,29% 7%,37% 4%,46% 10%,54% 3%,63% 8%,72% 2%,81% 9%,89% 4%,97% 8%,99% 21%,98% 38%,100% 56%,98% 74%,99% 93%,94% 97%,87% 91%,79% 99%,70% 92%,62% 97%,53% 90%,44% 99%,36% 93%,27% 98%,19% 90%,11% 97%,2% 92%,1% 78%,2% 61%,0 43%,2% 25%);filter:blur(2.4px)}.stage-core{position:absolute;left:655px;top:303px;width:610px;height:342px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--paper) url('/assets/paper-fiber-texture-v1.png') center/360px 260px;clip-path:polygon(1% 8%,6% 3%,13% 9%,21% 2%,29% 7%,37% 4%,46% 10%,54% 3%,63% 8%,72% 2%,81% 9%,89% 4%,97% 8%,99% 21%,98% 38%,100% 56%,98% 74%,99% 93%,94% 97%,87% 91%,79% 99%,70% 92%,62% 97%,53% 90%,44% 99%,36% 93%,27% 98%,19% 90%,11% 97%,2% 92%,1% 78%,2% 61%,0 43%,2% 25%);filter:drop-shadow(0 18px 12px rgba(45,30,21,.22));text-align:center}.stage-core strong{color:var(--ink);font-family:"Arial Black",Impact,sans-serif;line-height:1;font-weight:1000;letter-spacing:-6px;white-space:nowrap}.stage-core span{margin-top:17px;color:var(--ink);line-height:1.2;font-weight:900;letter-spacing:1px;white-space:nowrap}.stage-bottom{left:610px;top:790px;width:700px;text-align:center}.stage-bottom .stage-main{margin-top:13px;line-height:1.15}.stage-bottom small{display:block;margin-top:8px;color:#4f4a43;line-height:1.2;font-weight:800}
    .result{width:min(100%,1180px);margin-top:18px;padding:16px;border:1px solid var(--line);border-radius:10px;background:rgba(244,240,232,.8)}.result[hidden]{display:none}.result h3{margin:0 0 10px;font-size:15px}.result video{width:100%;display:block;border-radius:8px;background:#211f1c}.download{display:inline-block;margin-top:10px;color:var(--brick);font-size:13px;font-weight:800}
    @media(max-width:900px){.shell{grid-template-columns:1fr}.panel{border-right:0;border-bottom:1px solid var(--line)}.work{padding:26px 16px 38px}.work-head{display:block}.note{text-align:left}}
  </style>
</head>
<body><div class="shell">
  <aside class="panel"><p class="eyebrow">19 · EDITABLE RESULT</p><h1>编辑这个动效</h1><p class="intro">这是 Skill 生成后的人工修改入口。改完文字，再重新生成 MP4。</p>
    <form id="editor" class="fields">
      <label>核心概念<input name="coreTitle" maxlength="12" required></label><label>一句话说明<input name="coreSubtitle" maxlength="20" required></label>
      <div class="pair"><label>左侧小标题<input name="leftLabel" maxlength="8" required></label><label>左侧内容<input name="leftText" maxlength="12" required></label></div>
      <div class="pair"><label>右侧小标题<input name="rightLabel" maxlength="8" required></label><label>右侧重点<span class="triple"><input name="rightPrefix" maxlength="8" aria-label="前缀"><input name="rightHighlight" maxlength="8" required aria-label="高亮"><input name="rightSuffix" maxlength="8" aria-label="后缀"></span></label></div>
      <div class="pair"><label>下方小标题<input name="bottomLabel" maxlength="8" required></label><label>下方主句<input name="bottomLine1" maxlength="14" required></label></div>
      <label>下方补充说明<input name="bottomLine2" maxlength="18" required></label>
      <label>视频时长<select name="durationSeconds"><option value="4">4秒</option><option value="5">5秒</option><option value="6">6秒</option><option value="7">7秒</option><option value="8">8秒</option></select></label>
      <div class="actions"><button id="reset" type="button">恢复本次结果</button><button id="download-config" type="button">下载配置</button><button id="render" class="primary" type="submit">修改后重新生成 MP4</button></div>
    </form><p id="status" class="status" aria-live="polite">正在读取动效配置……</p>
  </aside>
  <main class="work"><header class="work-head"><div><p>SKILL 生成结果</p><h2 id="heading">动效 Skill</h2></div><p class="note">正常生成无需经过此页；只有想修改文字时才打开。</p></header>
    <section class="preview"><div class="stage" id="preview-stage"><svg class="stage-lines" viewBox="0 0 1920 1080"><path d="M700 360 L585 255" fill="none" stroke="#9a382d" stroke-width="4" stroke-linecap="round"/><path d="M1220 360 L1330 220" fill="none" stroke="#9a382d" stroke-width="4" stroke-linecap="round"/><path d="M960 650 L960 758" fill="none" stroke="#9a382d" stroke-width="4" stroke-linecap="round"/><circle cx="585" cy="255" r="8" fill="#9a382d"/><circle cx="1330" cy="220" r="8" fill="#9a382d"/><circle cx="960" cy="758" r="8" fill="#9a382d"/></svg><div class="stage-node stage-left"><div class="stage-label" id="p-left-label"></div><div class="stage-main" id="p-left-text"></div></div><div class="stage-node stage-right"><div class="stage-label" id="p-right-label"></div><div class="stage-main"><span id="p-right-prefix"></span><span class="stage-right-highlight" id="p-right-highlight"></span><span id="p-right-suffix"></span></div></div><div class="stage-shadow"></div><div class="stage-core"><strong id="p-title"></strong><span id="p-subtitle"></span></div><div class="stage-node stage-bottom"><div class="stage-label" id="p-bottom-label"></div><div class="stage-main" id="p-bottom-line1"></div><small id="p-bottom-line2"></small></div></div></section>
    <section id="result" class="result" hidden><h3>Remotion 最终视频</h3><video id="result-video" controls loop></video><a id="download-video" class="download" download>下载 MP4</a></section>
  </main>
</div><script>
const form=document.querySelector('#editor'),status=document.querySelector('#status'),renderButton=document.querySelector('#render'),result=document.querySelector('#result'),video=document.querySelector('#result-video'),download=document.querySelector('#download-video');let baseline;
const values=()=>{const d=new FormData(form);return{templateId:'concept-explainer-radial',coreTitle:d.get('coreTitle'),coreSubtitle:d.get('coreSubtitle'),leftLabel:d.get('leftLabel'),leftText:d.get('leftText'),rightLabel:d.get('rightLabel'),rightPrefix:d.get('rightPrefix'),rightHighlight:d.get('rightHighlight'),rightSuffix:d.get('rightSuffix'),bottomLabel:d.get('bottomLabel'),bottomLine1:d.get('bottomLine1'),bottomLine2:d.get('bottomLine2'),durationSeconds:Number(d.get('durationSeconds'))}};
const fit=(text,preferred,safeChars,min)=>Math.max(min,Math.min(preferred,preferred*safeChars/Math.max(Array.from(text).length,safeChars)));const scaleStage=()=>{const preview=document.querySelector('.preview'),stage=document.querySelector('#preview-stage');stage.style.transform=`scale(${preview.clientWidth/1920})`};new ResizeObserver(scaleStage).observe(document.querySelector('.preview'));scaleStage();
const update=()=>{const d=values();document.querySelector('#heading').textContent=d.coreTitle;for(const k of ['title','subtitle','left-label','left-text','right-label','right-prefix','right-highlight','right-suffix','bottom-label','bottom-line1','bottom-line2']){const map={title:'coreTitle',subtitle:'coreSubtitle','left-label':'leftLabel','left-text':'leftText','right-label':'rightLabel','right-prefix':'rightPrefix','right-highlight':'rightHighlight','right-suffix':'rightSuffix','bottom-label':'bottomLabel','bottom-line1':'bottomLine1','bottom-line2':'bottomLine2'};document.querySelector('#p-'+k).textContent=d[map[k]]}document.querySelector('#p-title').style.fontSize=`${fit(d.coreTitle,130,8,96)}px`;document.querySelector('#p-subtitle').style.fontSize=`${fit(d.coreSubtitle,39,14,30)}px`;document.querySelector('#p-left-text').style.fontSize=`${fit(d.leftText,68,8,52)}px`;document.querySelector('#p-bottom-line1').style.fontSize=`${fit(d.bottomLine1,66,9,50)}px`;document.querySelector('#p-bottom-line2').style.fontSize=`${fit(d.bottomLine2,36,12,29)}px`};
const apply=c=>{Object.entries(c).forEach(([k,v])=>{const f=form.elements.namedItem(k);if(f)f.value=String(v)});update()};const showVideo=url=>{if(!url)return;video.src=url+'?t='+Date.now();download.href=url;download.download=url.split('/').pop();result.hidden=false};
const downloadJson=d=>{const u=URL.createObjectURL(new Blob([JSON.stringify(d,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='concept-explainer-radial-config.json';a.click();URL.revokeObjectURL(u)};
form.addEventListener('input',update);document.querySelector('#reset').addEventListener('click',()=>{apply(baseline);status.textContent='已恢复本次 Skill 生成的内容。'});document.querySelector('#download-config').addEventListener('click',()=>downloadJson(values()));
form.addEventListener('submit',async e=>{e.preventDefault();if(!form.reportValidity())return;renderButton.disabled=true;result.hidden=true;status.className='status';status.textContent='正在重新生成 MP4……';try{const r=await fetch('/api/render',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(values())}),d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||'生成失败。');baseline=d.config;showVideo(d.videoUrl);history.replaceState(null,'',d.editUrl);status.textContent='修改后的 MP4 已生成。'}catch(e){status.className='status error';status.textContent=e.message||'生成失败。'}finally{renderButton.disabled=false}});
(async()=>{try{const job=new URLSearchParams(location.search).get('job'),url=job?'/api/job?id='+encodeURIComponent(job):'/radial-default-config.json',r=await fetch(url),d=await r.json(),payload=job?d.config:d;if(!r.ok||!payload)throw new Error(d.error||'读取失败。');baseline=payload;apply(payload);if(job)showVideo(d.videoUrl);status.textContent=job?'已载入 Skill 生成结果，可以直接修改。':'已载入默认示例。';}catch(e){status.className='status error';status.textContent=e.message||'配置读取失败。'}})();
</script></body></html>
