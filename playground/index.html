<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%239b4037'/%3E%3Cpath d='M18 20h28v7H18zm0 12h20v7H18zm0 12h28v7H18z' fill='%23f3efe6'/%3E%3C/svg%3E" />
  <title>视频动效素材库 Playground</title>
  <style>
    :root {
      --paper: #e8e4da;
      --paper-deep: #d7d1c4;
      --panel: #f3efe6;
      --ink: #1d1c19;
      --muted: #716c63;
      --line: rgba(29, 28, 25, 0.16);
      --accent: #9b4037;
      --accent-soft: rgba(155, 64, 55, 0.12);
      --shadow: 0 22px 60px rgba(52, 43, 32, 0.13);
    }

    * { box-sizing: border-box; }

    [hidden] { display: none !important; }

    html, body { margin: 0; min-height: 100%; }

    body {
      min-height: 100dvh;
      overflow: hidden;
      color: var(--ink);
      background:
        linear-gradient(rgba(255,255,255,0.16), rgba(255,255,255,0.16)),
        repeating-linear-gradient(0deg, transparent 0 3px, rgba(45, 39, 30, 0.018) 3px 4px),
        var(--paper);
      font-family: "Segoe UI Variable", "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
    }

    button, input { font: inherit; }

    .app {
      min-height: 100dvh;
      display: grid;
      grid-template-columns: minmax(260px, 330px) minmax(0, 1fr);
    }

    .sidebar {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--line);
      background: rgba(243, 239, 230, 0.76);
      backdrop-filter: blur(18px);
    }

    .brand {
      padding: 30px 28px 22px;
      border-bottom: 1px solid var(--line);
    }

    .eyebrow {
      margin: 0 0 9px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      max-width: 11ch;
      font-size: clamp(25px, 2.2vw, 34px);
      line-height: 1.08;
      letter-spacing: -0.04em;
    }

    .search-wrap {
      padding: 16px 18px;
      border-bottom: 1px solid var(--line);
    }

    .search {
      width: 100%;
      height: 40px;
      padding: 0 13px;
      border: 1px solid var(--line);
      border-radius: 9px;
      outline: none;
      color: var(--ink);
      background: rgba(255,255,255,0.45);
      transition: border-color 180ms ease, background 180ms ease;
    }

    .search:focus {
      border-color: var(--accent);
      background: rgba(255,255,255,0.7);
    }

    .nav {
      min-height: 0;
      overflow-y: auto;
      padding: 8px 10px 20px;
    }

    .nav-item {
      width: 100%;
      display: block;
      align-items: center;
      padding: 13px 14px 13px 22px;
      border: 0;
      border-bottom: 1px solid var(--line);
      color: var(--ink);
      background: transparent;
      text-align: left;
      cursor: pointer;
      transition: transform 180ms ease, color 180ms ease, background 180ms ease;
    }

    .nav-item:hover { background: rgba(255,255,255,0.42); }

    .nav-item:active { transform: translateY(1px) scale(0.99); }

    .nav-item[aria-selected="true"] {
      color: var(--accent);
      background: var(--accent-soft);
    }

    .nav-name {
      overflow: hidden;
      font-size: 14px;
      font-weight: 760;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .empty-nav {
      padding: 24px 12px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
    }

    .main {
      min-width: 0;
      min-height: 100dvh;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      padding: 28px clamp(26px, 4vw, 68px) 24px;
    }

    .topbar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 22px;
      padding-bottom: 20px;
    }

    .title-group { min-width: 0; }

    .template-id {
      margin: 0 0 7px;
      color: var(--accent);
      font-family: "Cascadia Mono", "Consolas", monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h2 {
      margin: 0;
      font-size: clamp(30px, 4vw, 54px);
      line-height: 1;
      letter-spacing: -0.055em;
    }

    .stage-wrap {
      min-height: 0;
      display: grid;
      place-items: center;
    }

    .stage {
      position: relative;
      width: min(100%, 1180px);
      aspect-ratio: 16 / 9;
      overflow: hidden;
      border: 1px solid rgba(29, 28, 25, 0.22);
      border-radius: 12px;
      background: #24221f;
      box-shadow: var(--shadow);
    }

    video {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      background: #24221f;
    }

    .static-preview {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      background: #24221f;
    }

    .video-loading,
    .video-error {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 28px;
      text-align: center;
      color: #ece6da;
      background: #24221f;
      pointer-events: none;
    }

    .video-loading::before {
      content: "";
      position: absolute;
      width: 46%;
      height: 2px;
      overflow: hidden;
      background: rgba(255,255,255,0.15);
      animation: load-pulse 1.2s ease-in-out infinite;
    }

    .video-loading span,
    .video-error span {
      position: relative;
      margin-top: 58px;
      font-size: 13px;
      letter-spacing: 0.05em;
    }

    .video-error { color: #f0c4bd; }

    @keyframes load-pulse {
      0%, 100% { transform: scaleX(0.35); opacity: 0.4; }
      50% { transform: scaleX(1); opacity: 0.9; }
    }

    .details {
      width: min(100%, 1180px);
      margin: 0 auto;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 28px;
      align-items: end;
      padding-top: 18px;
    }

    .description {
      margin: 0;
      max-width: 68ch;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.72;
    }

    .detail-tags {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 7px;
    }

    .detail-tag {
      padding: 6px 9px;
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--muted);
      background: rgba(255,255,255,0.26);
      font-size: 11px;
      font-weight: 700;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .category-group + .category-group { margin-top: 6px; }

    .category-heading {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 13px;
      border: 0;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      background: transparent;
      text-align: left;
      cursor: pointer;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.08em;
      transition: color 180ms ease, background 180ms ease, transform 180ms ease;
    }

    .category-heading:hover {
      color: var(--accent);
      background: rgba(255,255,255,0.42);
    }

    .category-heading:active { transform: translateY(1px); }

    .category-heading:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: -2px;
    }

    .category-heading[aria-expanded="true"] {
      color: var(--accent);
      background: rgba(166, 68, 53, 0.07);
    }

    .category-heading strong {
      color: var(--ink);
      font-size: 14px;
      letter-spacing: 0.02em;
    }

    .category-heading[aria-expanded="true"] strong { color: var(--accent); }

    .category-heading-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      font-variant-numeric: tabular-nums;
    }

    .category-chevron {
      width: 8px;
      height: 8px;
      border-right: 1.5px solid currentColor;
      border-bottom: 1.5px solid currentColor;
      transform: rotate(45deg) translateY(-2px);
      transition: transform 180ms ease;
    }

    .category-heading[aria-expanded="true"] .category-chevron {
      transform: rotate(225deg) translate(-1px, -1px);
    }

    .category-items {
      padding: 3px 0 8px;
      animation: reveal-category 180ms ease both;
    }

    @keyframes reveal-category {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .category-empty {
      margin: 0 10px 6px;
      padding: 11px 12px;
      border-left: 3px solid var(--paper-deep);
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
    }

    .inspection {
      width: min(100%, 1180px);
      margin: 0 auto;
      padding-top: 18px;
    }

    .inspection-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.6fr) minmax(220px, 0.9fr);
      gap: 1px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: var(--line);
    }

    .inspection-cell {
      min-width: 0;
      padding: 13px 14px 15px;
      background: rgba(243, 239, 230, 0.88);
    }

    .inspection-label {
      display: block;
      margin-bottom: 7px;
      color: var(--accent);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.12em;
    }

    .inspection-cell p {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.58;
    }

    .compare {
      width: min(100%, 1180px);
      margin: 20px auto 0;
      padding-bottom: 26px;
    }

    .compare-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 10px;
    }

    .compare-head h3 {
      margin: 0;
      font-size: 15px;
      letter-spacing: -0.02em;
    }

    .compare-head p {
      margin: 0;
      color: var(--muted);
      font-size: 11px;
    }

    .compare-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 10px;
    }

    .compare-card {
      min-width: 0;
      padding: 0;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--ink);
      background: rgba(255,255,255,0.28);
      text-align: left;
      cursor: pointer;
      transition: transform 180ms ease, border-color 180ms ease, background 180ms ease;
    }

    .compare-card:hover {
      transform: translateY(-2px);
      border-color: rgba(155, 64, 55, 0.42);
      background: rgba(255,255,255,0.52);
    }

    .compare-card:active { transform: translateY(0) scale(0.99); }

    .compare-card[aria-selected="true"] {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-soft);
    }

    .compare-card img {
      width: 100%;
      aspect-ratio: 16 / 9;
      display: block;
      object-fit: cover;
      background: #24221f;
    }

    .compare-card span {
      display: block;
      padding: 9px 10px 10px;
      overflow: hidden;
      font-size: 12px;
      font-weight: 760;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .compare-card small {
      display: block;
      margin-top: 4px;
      color: var(--accent);
      font-size: 10px;
      font-weight: 800;
    }

    .compare-empty {
      padding: 18px;
      border-left: 3px solid var(--accent);
      color: var(--muted);
      background: rgba(255,255,255,0.3);
      font-size: 13px;
      line-height: 1.65;
    }

    .search-summary {
      margin: 10px 2px 0;
      color: var(--muted);
      font-size: 11px;
    }

    @media (min-width: 821px) {
      body { overflow: auto; }
      .sidebar { position: sticky; top: 0; height: 100dvh; }
      .main { grid-template-rows: auto auto auto auto; }
      .stage-wrap { min-height: 0; }
    }

    @media (max-width: 820px) {
      body { overflow: auto; }

      .app {
        grid-template-columns: 1fr;
        grid-template-rows: auto minmax(0, 1fr);
      }

      .sidebar {
        min-height: auto;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .brand { padding: 22px 20px 16px; }
      .brand h1 { max-width: none; }
      .search-wrap { padding: 12px 14px; }

      .nav {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
        overflow: visible;
        padding: 10px 14px 14px;
      }

      .category-group { min-width: 0; }
      .category-group + .category-group { margin-top: 0; }
      .category-group.is-expanded { grid-column: 1 / -1; }

      .category-heading {
        height: 48px;
        padding: 10px 11px;
        border: 1px solid var(--line);
        border-radius: 8px;
      }

      .category-heading strong {
        min-width: 0;
        overflow: hidden;
        font-size: 12px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .category-heading-meta { gap: 7px; }

      .category-items {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 7px;
        padding: 8px 0 0;
      }

      .nav-item {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 10px 12px;
      }

      .main {
        min-height: auto;
        padding: 24px 16px 28px;
      }

      .topbar { padding-bottom: 18px; }
      .details { grid-template-columns: 1fr; gap: 12px; }
      .detail-tags { justify-content: flex-start; }
      .inspection-grid { grid-template-columns: 1fr 1fr; }
      .compare-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 520px) {
      .inspection-grid { grid-template-columns: 1fr; }
      .compare-grid { grid-template-columns: 1fr; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar" aria-label="动效模板列表">
      <header class="brand">
        <p class="eyebrow">Motion Library</p>
        <h1>视频动效素材库</h1>
      </header>

      <div class="search-wrap">
        <label class="sr-only" for="search">搜索样式</label>
        <input id="search" class="search" type="search" placeholder="搜索大类、样式或用途" autocomplete="off" />
        <p id="search-summary" class="search-summary" hidden></p>
      </div>

      <nav id="template-nav" class="nav" aria-label="选择一个动效模板"></nav>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="title-group">
          <p id="category-label" class="template-id"></p>
          <h2 id="style-name"></h2>
        </div>
      </header>

      <section class="stage-wrap" aria-label="样片播放器">
        <div class="stage">
          <video id="preview" controls playsinline preload="metadata" muted loop></video>
          <img id="static-preview" class="static-preview" alt="当前样式效果图" hidden />
          <div id="loading" class="video-loading"><span>样片加载中</span></div>
          <div id="error" class="video-error" hidden><span>样片暂时无法播放，请稍后重试。</span></div>
        </div>
      </section>

      <section class="inspection" aria-label="样式介绍">
        <div class="inspection-grid">
          <div class="inspection-cell"><span class="inspection-label">画面说明</span><p id="description"></p></div>
          <div class="inspection-cell"><span class="inspection-label">适合</span><p id="best-for"></p></div>
        </div>
      </section>

      <section class="compare" aria-label="同类样式视觉对比">
        <div class="compare-head">
          <h3 id="compare-title"></h3>
          <p id="compare-help">点击缩略图，直接切换真实动态样片</p>
        </div>
        <div id="compare-grid" class="compare-grid"></div>
      </section>
    </main>
  </div>

  <script>

      {id: "list", name: "列举与归纳"},
      {id: "process", name: "流程与阶段"},
      {id: "compare", name: "对比与变化"},
      {id: "relation", name: "关系与结构"},
      {id: "concept", name: "概念与因果"},
      {id: "emphasis", name: "重点与数据"},
      {id: "decision", name: "判断与选择"},
      {id: "evidence", name: "真实素材与证据"}

    const styles = [

      {id:"storyboard-work-order", category:"evidence", name:"分镜工作单", code:"storyboard-work-order / single-shot-work-order", src:"samples/storyboard-work-order-dynamic-v2.mp4", poster:"posters/storyboard-work-order-candidate-v2.png", description:"把一个镜头的编号、时间码、画面、字幕、执行说明和所需素材整理成可直接执行的工作单。", bestFor:"单镜头规划、分镜交接、声音到画面的执行说明", avoidFor:"并列观点、项目状态、时间线、多个完整分镜", editable:"标题、镜头编号、时间码、镜头图片、字幕、画面说明、素材标签"}
    ];

    const nav = document.querySelector("#template-nav");
    const search = document.querySelector("#search");
    const searchSummary = document.querySelector("#search-summary");
    const video = document.querySelector("#preview");
    const staticPreview = document.querySelector("#static-preview");
    const loading = document.querySelector("#loading");
    const error = document.querySelector("#error");
    const styleNameEl = document.querySelector("#style-name");
    const categoryLabelEl = document.querySelector("#category-label");
    const descriptionEl = document.querySelector("#description");
    const bestForEl = document.querySelector("#best-for");
    const compareTitleEl = document.querySelector("#compare-title");
    const compareHelpEl = document.querySelector("#compare-help");
    const compareGrid = document.querySelector("#compare-grid");

    const params = new URLSearchParams(window.location.search);
    const requestedCategory = params.get("category");
    const filteredCategory = categories.some((category) => category.id === requestedCategory) ? requestedCategory : null;
    const baseStyles = filteredCategory ? styles.filter((style) => style.category === filteredCategory) : styles;

    let activeId = baseStyles[0]?.id ?? styles[0].id;
    let visibleStyles = [...baseStyles];
    let expandedCategory = filteredCategory;

    if (filteredCategory === "transition") {
      document.querySelector(".brand h1").textContent = "选择过渡动画样式";
      search.placeholder = "搜索过渡样式";
    }

    const categoryName = (id) => categories.find((category) => category.id === id)?.name ?? id;

    const renderNav = () => {
      nav.innerHTML = "";

      if (visibleStyles.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty-nav";
        empty.textContent = "没有找到匹配的样式。可以搜索大类、用途或状态。";
        nav.appendChild(empty);
        return;
      }

      categories.forEach((category) => {
        if (filteredCategory && category.id !== filteredCategory) return;
        const items = visibleStyles.filter((style) => style.category === category.id);
        const isSearching = Boolean(search.value.trim());
        if (items.length === 0 && isSearching) return;
        const isExpanded = isSearching || expandedCategory === category.id;

        const group = document.createElement("section");
        group.className = `category-group${isExpanded ? " is-expanded" : ""}`;
        const heading = document.createElement("button");
        heading.type = "button";
        heading.className = "category-heading";
        heading.setAttribute("aria-expanded", String(isExpanded));
        heading.setAttribute("aria-controls", `category-${category.id}`);
        heading.innerHTML = `<strong>${category.name}</strong><span class="category-heading-meta"><span>${items.length || "待补"}</span><span class="category-chevron" aria-hidden="true"></span></span>`;
        heading.addEventListener("click", () => {
          if (isSearching) return;
          expandedCategory = expandedCategory === category.id ? null : category.id;
          renderNav();
        });
        group.appendChild(heading);

        if (!isExpanded) {
          nav.appendChild(group);
          return;
        }

        const itemList = document.createElement("div");
        itemList.id = `category-${category.id}`;
        itemList.className = "category-items";

        if (items.length === 0) {
          const empty = document.createElement("p");
          empty.className = "category-empty";
          empty.textContent = category.empty || "当前还没有可展示的样式。";
          itemList.appendChild(empty);
        }

        items.forEach((style) => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "nav-item";
          button.dataset.id = style.id;
          button.setAttribute("aria-selected", String(style.id === activeId));
          button.innerHTML = `<span class="nav-name">${style.choice ? `${style.choice}｜` : ""}${style.name}</span>`;
          button.addEventListener("click", () => selectStyle(style.id, true));
          itemList.appendChild(button);
        });
        group.appendChild(itemList);
        nav.appendChild(group);
      });
    };

    const renderComparison = (categoryId) => {
      const items = styles.filter((style) => style.category === categoryId);
      compareTitleEl.textContent = `${categoryName(categoryId)} · ${items.length} 种视觉样式`;
      compareHelpEl.textContent = "点击缩略图切换样片";
      compareGrid.innerHTML = "";

      if (items.length === 0) {
        compareGrid.innerHTML = `<div class="compare-empty">这个分类暂时没有可展示内容。</div>`;
        return;
      }

      items.forEach((style) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "compare-card";
        button.dataset.id = style.id;
        button.setAttribute("aria-selected", String(style.id === activeId));
        button.innerHTML = `<img src="${style.poster}" alt="${style.name}样片缩略图" loading="lazy"><span>${style.choice ? `${style.choice}｜` : ""}${style.name}</span>`;
        button.addEventListener("click", () => selectStyle(style.id, true));
        compareGrid.appendChild(button);
      });
    };

    const selectStyle = (id, shouldPlay = false) => {
      const style = styles.find((item) => item.id === id);
      if (!style) return;

      activeId = id;
      styleNameEl.textContent = `${style.choice ? `${style.choice}｜` : ""}${style.name}`;
      categoryLabelEl.textContent = style.choice ? `${categoryName(style.category)} · 看完后回复“${style.choice}”` : categoryName(style.category);
      descriptionEl.textContent = style.description;
      bestForEl.textContent = style.bestFor;

      error.hidden = true;
      loading.hidden = false;
      video.pause();
      if (style.mediaType === "image") {
        video.hidden = true;
        staticPreview.hidden = false;
        staticPreview.src = style.src;
      } else {
        staticPreview.hidden = true;
        video.hidden = false;
        video.poster = style.poster;
        video.src = style.src;
        video.load();
      }

      document.querySelectorAll(".nav-item").forEach((button) => {
        button.setAttribute("aria-selected", String(button.dataset.id === id));
      });
      renderComparison(style.category);

      if (shouldPlay && style.mediaType !== "image") {
        video.muted = true;
        const playPromise = video.play();
        if (playPromise) playPromise.catch(() => {});
      }
    };

    video.addEventListener("loadeddata", () => {
      loading.hidden = true;
      error.hidden = true;
    });

    video.addEventListener("error", () => {
      loading.hidden = true;
      error.hidden = false;
    });

    staticPreview.addEventListener("load", () => {
      loading.hidden = true;
      error.hidden = true;
    });

    staticPreview.addEventListener("error", () => {
      loading.hidden = true;
      error.hidden = false;
    });

    search.addEventListener("input", (event) => {
      const query = event.target.value.trim().toLowerCase();
      visibleStyles = baseStyles.filter((style) => {
        const haystack = [style.name, categoryName(style.category), style.description, style.bestFor].join(" ").toLowerCase();
        return haystack.includes(query);
      });
      searchSummary.textContent = query ? `找到 ${visibleStyles.length} 种样式` : "";
      searchSummary.hidden = !query;
      if (!query) expandedCategory = null;
      if (visibleStyles.length && !visibleStyles.some((style) => style.id === activeId)) {
        selectStyle(visibleStyles[0].id);
      }
      renderNav();
    });

    document.addEventListener("keydown", (event) => {
      if (event.target === search) return;
      const sequence = visibleStyles.length ? visibleStyles : baseStyles;
      const currentIndex = sequence.findIndex((item) => item.id === activeId);
      if (event.key === "ArrowDown" || event.key === "ArrowRight") {
        event.preventDefault();
        selectStyle(sequence[(currentIndex + 1) % sequence.length].id, true);
      }
      if (event.key === "ArrowUp" || event.key === "ArrowLeft") {
        event.preventDefault();
        selectStyle(sequence[(currentIndex - 1 + sequence.length) % sequence.length].id, true);
      }
    });

    renderNav();
    selectStyle(activeId);
  </script>
